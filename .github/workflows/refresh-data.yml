name: Refresh BDC Data

on:
  push:
    branches: [main, staging]
  schedule:
    # Run weekly on Sunday at 2am UTC (same as Vercel cron)
    - cron: "0 2 * * 0"
  workflow_dispatch: # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch EDGAR data
        run: pnpm fetch-data

      - name: Normalize data
        run: pnpm normalize

      - name: Upload to Vercel Blob
        run: pnpm upload-blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
